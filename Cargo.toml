[workspace]
resolver = "2"
members = [
    "crates/onyx-core",
    "crates/onyx-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Onyx Void"]
rust-version = "1.75"

# ─── Shared dependency versions (inherited by workspace members) ───

[workspace.dependencies]
# Internal crates
onyx-core = { path = "crates/onyx-core" }

# security helpers
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# ── Visual Engine (Vello Stack) ──
winit    = "0.30"
wgpu     = "27"
vello    = "0.7"
parley   = "0.4"
pollster = "0.4"

# ── CRDT ──
loro = "1"

# ── Identity / Time ──
uuid   = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# ── Observability ──
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Serialization ──
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Error handling ──
anyhow = "1"

# ── Phase 2 Infrastructure ──
tantivy = "0.22"
sha2    = "0.10"
walkdir = "2"
base64  = "0.21"

# ── Phase 3 Power Features ──
regex   = "1.10"
similar = "2.4"

# ── Phase 2.9 Performance & Security ──
argon2           = "0.5"
chacha20poly1305 = "0.10"
rand             = "0.8"
dirs             = "5"

# ── Phase 4 Six-Fold Foundation ──
pulldown-latex = "0.1"
roxmltree      = "0.20"

# ── AI / ML (Candle) ──
candle-core         = "0.9"
candle-nn           = "0.9"
candle-transformers = "0.9"
tokenizers          = "0.15"
hf-hub              = "0.5"

# ─── Build profiles ──────────────────────────────────────────────

[profile.release]
opt-level = "z"      # Optimize for minimal binary size
lto = "fat"          # Full Link Time Optimization (cross-crate optimization)
codegen-units = 1     # Allow max optimization across the whole program
panic = "abort"      # Remove the overhead of stack unwinding
strip = "symbols"    # Remove all debug symbols/names from the binary
overflow-checks = true  # catch integer overflow in release builds

[profile.dev]
opt-level = 1          # Faster Makepad shader compilation in debug

[profile.dev.package."*"]
opt-level = 2          # Optimize deps even in debug for smooth 144Hz
