[workspace]
resolver = "2"
members = [
    "crates/onyx-core",
    "crates/onyx-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Onyx Void"]
rust-version = "1.75"

# ─── Shared dependency versions (inherited by workspace members) ───

[workspace.dependencies]
# Internal crates
onyx-core = { path = "crates/onyx-core" }

# ── Visual Engine (Vello Stack) ──
winit    = "0.30"
wgpu     = "27"
vello    = "0.7"
parley   = "0.4"
pollster = "0.4"

# ── CRDT ──
loro = "1"

# ── Identity / Time ──
uuid   = { version = "1", features = ["v4"] }
chrono = "0.4"

# ── Observability ──
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Error handling ──
anyhow = "1"

# ─── Build profiles ──────────────────────────────────────────────

[profile.release]
opt-level = "z"      # Optimize for minimal binary size
lto = "fat"          # Full Link Time Optimization (cross-crate optimization)
codegen-units = 1     # Allow max optimization across the whole program
panic = "abort"      # Remove the overhead of stack unwinding
strip = "symbols"    # Remove all debug symbols/names from the binary

[profile.dev]
opt-level = 1          # Faster Makepad shader compilation in debug

[profile.dev.package."*"]
opt-level = 2          # Optimize deps even in debug for smooth 144Hz
