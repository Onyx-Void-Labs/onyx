# Onyx Void — Cargo build configuration
#
# Android NDK: Set ANDROID_NDK_HOME env var, then uncomment the
# linker lines below to cross-compile for aarch64-linux-android.

[build]
# Incremental compilation for dev speed
incremental = true

# ── Android NDK (uncomment after installing NDK) ─────────────────
# [target.aarch64-linux-android]
# linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android33-clang.cmd"
# ar     = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar"

# ── CMake generator fallback (Windows only) ───────────────────────
# The `cmake` crate auto-detects the VS generator, but some CMake
# installs don't ship a generator for the newest VS version.
# `force = false` means: use this value ONLY if CMAKE_GENERATOR is
# not already set in the calling environment.  This lets
# `cargo makepad android run` (which now sets CMAKE_GENERATOR=Ninja)
# override the VS default without conflict.
[env]
CMAKE_GENERATOR = { value = "Visual Studio 17 2022", force = false }

# ── Windows optimizations ────────────────────────────────────────
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
