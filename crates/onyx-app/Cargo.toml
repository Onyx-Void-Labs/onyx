[package]
name = "onyx-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "onyx_void"
path = "src/main.rs"

[features]
default = []
full = ["onyx-math/typst-backend", "onyx-store/surrealdb-backend"]

[dependencies]
# Internal crates
onyx-core   = { workspace = true }
onyx-editor = { workspace = true }
onyx-math   = { workspace = true }
onyx-store  = { workspace = true }
onyx-net    = { workspace = true }

# Vello stack
winit    = { workspace = true }
vello    = { workspace = true }
parley   = { workspace = true }
pollster = { workspace = true }

# Async runtime (for Iroh background thread)
tokio = { workspace = true }

# Iroh networking (used by net_bridge)
iroh         = { workspace = true }
iroh-gossip  = { workspace = true }
zstd         = { workspace = true }
anyhow       = { workspace = true }

# Audio / Voice (Phase 3: The Senses)
# Gated to non-Android — Android builds skip CMake/Opus entirely.

[target.'cfg(not(target_os = "android"))'.dependencies]
cpal         = { workspace = true }
audiopus     = { workspace = true }
bytes        = { workspace = true }

# Observability
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# Global allocator
mimalloc = "0.1"
